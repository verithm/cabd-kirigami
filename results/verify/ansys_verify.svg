  <g id="text_18">
   <text style="font-size: 8px; font-family: 'Malgun Gothic'; fill: #5b6670" transform="translate(49.536 45.08975)">성공 = 부분 젖음 쌍안정, 완전 젖음 단안정, 세 출력 모두 |오차| ≤ τ. 목표 40개, 방법별 시드 0의 1순위 후보.</text>
   <text style="font-size: 8px; font-family: 'Malgun Gothic'; fill: #5b6670" transform="translate(49.536 53.856)">막대 위 숫자는 성공/해석 완료, 오차 막대는 Wilson 95% 구간.</text>
